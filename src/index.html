<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>document</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-w-[1280px]">

  <div class="border-b bg-white text-xs text-gray-600 py-2">
    <div class="w-[1280px] mx-auto px-4 flex justify-between items-center">
      <div>Сеть клиник Тверской области</div>
      <div class="flex items-center space-x-6">
        <span class="flex items-center gap-1">
          <i data-lucide="map-pin" class="w-3.5 h-3.5 text-emerald-600"></i>
          Вышний Волочек
        </span>
        <span class="flex items-center gap-1 font-semibold text-gray-800">
          <i data-lucide="phone" class="w-3.5 h-3.5 text-emerald-600"></i>
          +7 (4822) 00-00-00
        </span>
        <button class="bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1 rounded-full text-xs transition">
          Записаться на прием
        </button>
      </div>
    </div>
  </div>
  <section class="bg-gray-900 text-white">
    <div class="w-[1280px] mx-auto px-4 grid grid-cols-2 gap-8 items-center">
      <div class="space-y-6">
        <h2 class="text-3xl font-bold">Наши контакты</h2>
        <div class="space-y-4 text-xs text-gray-300">
          <div>
            <div class="text-gray-400 mb-1">Адрес:</div>
            <div>г. Вышний Волочек, ул. Володарского, d. 8</div>
          </div>
          <div>
            <div class="text-gray-400 mb-1">Телефон:</div>
            <div>+7 (4822) 00-00-00</div>
          </div>
          <div>
            <div class="text-gray-400 mb-1">E-mail:</div>
            <div>info@clinic.ru</div>
          </div>
        </div>
        <button class="bg-[#36B369] hover:bg-emerald-600 text-white px-6 py-2.5 rounded-full text-xs font-semibold transition">
          Записаться на прием
        </button>
      </div>

      <div class="w-[740px] h-[540px] bg-gray-700 relative">
        <img class="mt-[4px]" src="./imgs/image copy 13.png" alt="Map">    
      </div>
    </div>
  </section>
</body>
</html>
