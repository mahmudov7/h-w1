<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>document</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-w-[1280px]">

  <div class="border-b bg-white text-xs text-gray-600 py-2">
    <div class="w-[1280px] mx-auto px-4 flex justify-between items-center">
      <div>Сеть клиник Тверской области</div>
      <div class="flex items-center space-x-6">
        <span class="flex items-center gap-1">
          <i data-lucide="map-pin" class="w-3.5 h-3.5 text-emerald-600"></i>
          Вышний Волочек
        </span>
        <span class="flex items-center gap-1 font-semibold text-gray-800">
          <i data-lucide="phone" class="w-3.5 h-3.5 text-emerald-600"></i>
          +7 (4822) 00-00-00
        </span>
        <button class="bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1 rounded-full text-xs transition">
          Записаться на прием
        </button>
      </div>
    </div>
  </div>
  <section class="py-16 bg-gray-50">
    <div class="w-[1280px] mx-auto px-4">
      <div class="flex justify-between items-center mb-8">
        <h2 class="text-3xl font-bold text-gray-900">
          Направления нашей работы
        </h2>
        <a href="#" class="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2 rounded-full text-xs font-medium transition inline-flex items-center gap-1">
          Все направления 
        </a>
      </div>

      <div class="grid grid-cols-4 gap-6">
        <div class="bg-white rounded-lg overflow-hidden shadow-sm hover:shadow-md transition">
          <img src="imgs/image copy 2.png" alt="Гинекология" class="w-full h-38 object-cover" />
          <div class="p-4">
            <h3 class="font-bold text-gray-800">Гинекология</h3>
            <p class="text-xs text-[#2FA661] mt-1">Подробнее</p>
          </div>
        </div>

        <div class="bg-white rounded-lg overflow-hidden shadow-sm hover:shadow-md transition">
          <img src="imgs/image copy 3.png" alt="Урология" class="w-full h-38 object-cover" />
          <div class="p-4">
            <h3 class="font-bold text-gray-800">Урология</h3>
            <p class="text-xs text-[#2FA661] mt-1">Подробнее</p>
          </div>
        </div>

        <div class="bg-white rounded-lg overflow-hidden shadow-sm hover:shadow-md transition">
          <img src="imgs/image copy 4.png" alt="Оториноларингология" class="w-full h-38 object-cover" />
          <div class="p-4">
            <h3 class="font-bold text-gray-800">Оториноларингология</h3>
            <p class="text-xs text-[#2FA661] mt-1">Подробнее</p>
          </div>
        </div>

        <div class="bg-white rounded-lg overflow-hidden shadow-sm hover:shadow-md transition">
          <img src="imgs/image copy 7.png" alt="Неврология" class="w-full h-38 object-cover" />
          <div class="p-4">
            <h3 class="font-bold text-gray-800">Неврология</h3>
            <p class="text-xs text-[#2FA661] mt-1">Подробнее</p>
          </div>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
